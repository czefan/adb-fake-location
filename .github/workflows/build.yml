name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ""
            archive: tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN_NAME="adb-fake-location${{ matrix.suffix }}"
          TARGET_DIR="adb-fake-location-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${TARGET_DIR}"
          go build -trimpath -ldflags="-s -w" -o "${TARGET_DIR}/${BIN_NAME}" ./cmd/adb-fake-location
          cp README.md config.example.json "${TARGET_DIR}/" || true

          mkdir -p release-pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "release-pkg/${TARGET_DIR}.zip" "${TARGET_DIR}"
          else
            tar -czvf "release-pkg/${TARGET_DIR}.tar.gz" "${TARGET_DIR}"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adb-fake-location-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-pkg/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
